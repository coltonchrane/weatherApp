<header>
  <h1 id="tableLabel">Weather Forecast</h1>
  <p *ngIf="weather.location && !isLoading" class="location-name">{{weather.location}}</p>
</header>

<div *ngIf="isLoading" class="loader-container">
  <div class="spinner"></div>
  <p class="loading-text">Getting your location and weather data...</p>
</div>

<div *ngIf="!isLoading">
  <table *ngIf="weather.forecasts && weather.forecasts.length > 0">
    <thead>
      <tr>
        <th>Date</th>
        <th>Low (&deg;F)</th>
        <th>High (&deg;F)</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let forecast of weather.forecasts">
        <td>{{ forecast.time }}</td>
        <td>{{ forecast.lowTemp }}</td>
        <td>{{ forecast.highTemp }}</td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="!weather.location && !isLoading" class="error-text">
    Unable to load weather data. Please ensure location services are enabled.
  </p>
</div>
