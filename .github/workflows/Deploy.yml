name: Unified Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment Target'
        required: true
        default: 'azure'
        type: choice
        options:
          - azure
          - proxmox

jobs:
  deploy:
    # Use the appropriate runner based on the target
    runs-on: ${{ (github.event.inputs.target == 'proxmox' || (github.event_name == 'push' && false)) && 'self-hosted' || 'ubuntu-latest' }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --- BUILD PHASE (Common for both) ---
      - name: Install Frontend Dependencies
        run: |
          cd angularwithasp.client
          npm install

      - name: Build Frontend
        run: |
          cd angularwithasp.client
          npm run build -- --configuration production

      - name: Build & Publish Backend
        run: |
          cd AngularWithASP.Server
          dotnet publish -c Release -o ../publish --runtime linux-x64 --self-contained true

      - name: Package Frontend into Backend
        run: |
          mkdir -p publish/wwwroot
          SEARCH_PATH="angularwithasp.client/dist"
          export TARGET_DIR=$(find $SEARCH_PATH -name "index.html" -printf '%h' | head -n 1)
          echo "Found Angular index.html at: $TARGET_DIR"
          if [ -z "$TARGET_DIR" ]; then echo "Error: index.html not found in $SEARCH_PATH"; exit 1; fi
          cp -r $TARGET_DIR/* publish/wwwroot/
          
      - name: 'Debug: List Publish Directory'
        run: |
          echo "Listing top-level publish directory:"
          ls -F publish
          echo "Listing wwwroot directory:"
          ls -F publish/wwwroot
          # Make the binary executable (important for self-contained Linux)
          chmod +x publish/weatherApp.Server || true

      - name: 'Verify Secrets'
        run: |
          if [ -z "${{ secrets.AZURE_WEBAPP_NAME }}" ]; then echo "Error: AZURE_WEBAPP_NAME is missing"; exit 1; fi
          if [ -z "${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}" ]; then echo "Error: AZURE_WEBAPP_PUBLISH_PROFILE is missing"; exit 1; fi
          echo "All required secrets are present."

      # --- DEPLOY PHASE: AZURE ---
      - name: 'Deploy to Azure Web App'
        if: github.event.inputs.target == 'azure' || github.event_name == 'push'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: './publish'

      # --- DEPLOY PHASE: PROXMOX (Local IIS) ---
      - name: Stop IIS (W3SVC)
        if: github.event.inputs.target == 'proxmox'
        run: Stop-Service W3SVC
        shell: powershell

      - name: Deploy to Local Path
        if: github.event.inputs.target == 'proxmox'
        run: |
          Remove-Item -Path "C:\CTC-PCVM\weatherApp\*" -Recurse -Force
          Copy-Item -Path "publish\*" -Destination "C:\CTC-PCVM\weatherApp\" -Recurse -Force
        shell: powershell

      - name: Start IIS (W3SVC)
        if: github.event.inputs.target == 'proxmox'
        run: Start-Service W3SVC
        shell: powershell
