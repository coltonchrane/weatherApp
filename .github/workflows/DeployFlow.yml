name: Weather App Deploy

on:
  push:
    branches:
      -main
  
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Rebuild Solution
        run: dotnet build --configuration Release
      - name: Publish
        run: fotnet publish -o C:/CTC-PCVM/weatherApp/
